name: Deploy Derigava Support to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Static validation
        run: |
          node --check site/app.js
          node --check site/data/projects.js
          node --check site/data/support.js
          node --check site/data/i18n.js
          node scripts/check.mjs
      - name: Synchronize verified official brand assets
        run: python3 scripts/sync_brand.py
      - name: Verify local fonts and branding
        run: |
          test -s site/assets/mark-dark-color.png
          test -s site/assets/mark-dark-color.svg
          test -s site/assets/mark-light-color.svg
          test -s site/assets/fonts/Onest-Variable.ttf
          test -s site/assets/fonts/Unbounded-Variable.ttf
          test -s site/assets/fonts/JetBrainsMono-Regular.ttf
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
